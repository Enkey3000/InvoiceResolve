[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-resolve"
version = "0.1.0"
description = "Auditable agentic invoice reconciliation using synthetic records."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "InvoiceResolve contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.8,<1"]

[project.scripts]
invoice-resolve = "invoice_resolve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
